name: calc ci

on:
  push:
       branches: [main]

jobs:
     test:
         runs-on: ubuntu-latest
         steps:
           - name : checout code
             uses: actions/checkout@v4
           - name: set up python
             uses: actions/setup-python@v5
             with:
              python-version: "3.14"
           - name: Install dependencies
             run: pip install pytest

           - name: run tests
             run : python -m pytest -v
